<div class="page-header">
  <div>
    <h1>{{ brandId ? 'Edit Brand' : 'New Brand' }}</h1>
    <p class="page-subtitle">This name shows up in the Brand dropdown on the Product and Purchase screens.</p>
  </div>
  <a routerLink="/brands" class="btn btn-secondary">Back to list</a>
</div>

@if (!loading()) {
  <form class="card form-card" (ngSubmit)="save()">
    <div class="field">
      <label for="brand_name">Brand name</label>
      <input id="brand_name" name="brand_name" type="text" [(ngModel)]="form.brand_name" required placeholder="Samsung, LG, Bajaj..." />
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving...' : brandId ? 'Save changes' : 'Create brand' }}
    </button>
  </form>
}
