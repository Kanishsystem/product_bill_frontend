<div class="page-header">
  <div>
    <h1>{{ partyId ? 'Edit' : 'New' }} {{ form.party_type === 'supplier' ? 'Supplier' : 'Customer' }}</h1>
    <p class="page-subtitle">State code is derived automatically from the GSTIN's first 2 digits.</p>
  </div>
  <a routerLink="/parties" class="btn btn-secondary">Back to list</a>
</div>

@if (!loading()) {
  <form class="card form-card" (ngSubmit)="save()">
    @if (!partyId) {
      <div class="field type-field">
        <label for="party_type">Type</label>
        <select id="party_type" name="party_type" [(ngModel)]="form.party_type">
          <option value="customer">Customer</option>
          <option value="supplier">Supplier</option>
        </select>
      </div>
    }

    <div class="grid-2">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" [(ngModel)]="form.name" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="text" [(ngModel)]="form.phone" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="form.email" />
      </div>
      <div class="field">
        <label for="gstin">GSTIN (optional)</label>
        <input id="gstin" name="gstin" type="text" [(ngModel)]="form.gstin" placeholder="33ABCDE1234F1Z5" />
      </div>
    </div>

    <div class="field">
      <label for="address">Address</label>
      <textarea id="address" name="address" rows="2" [(ngModel)]="form.address"></textarea>
    </div>

    <button class="btn btn-primary" type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving...' : partyId ? 'Save changes' : 'Create' }}
    </button>
  </form>
}
